<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文本检测 - AI 文本检测系统</title>
  <link rel="stylesheet" href="/static/styles.css?v=20261023-3" />
</head>
<body>
  <div class="bg-shape bg-one"></div>
  <div class="bg-shape bg-two"></div>

  <header class="topbar centered-topbar">
    <h1>AI 文本检测系统</h1>
    <div class="user-panel">
      <span id="currentUser" class="muted"></span>
      <button id="goHistoryBtn" class="ghost">查看历史记录</button>
      <button id="logoutBtn" class="ghost">退出登录</button>
    </div>
  </header>

  <main class="layout-single">
    <section class="card detect-card-full">
      <div class="control-row">
        <div class="export-control-wrap sample-control-wrap">
          <button id="sampleBtn" class="ghost export-trigger sample-trigger" type="button">加载样例</button>
          <div id="sampleMenu" class="export-menu sample-menu hidden" aria-hidden="true">
            <div class="export-menu-panel" role="dialog" aria-modal="true" aria-label="选择样例">
              <div class="export-menu-title">选择样例</div>
              <div id="sampleMenuList" class="sample-menu-list"></div>
            </div>
          </div>
        </div>
        <button id="clearBtn" class="ghost">清除内容</button>
        <div class="export-control-wrap">
          <button id="exportDetectBtn" class="ghost export-trigger" type="button" disabled>结果导出</button>
          <div id="exportDetectMenu" class="export-menu hidden" aria-hidden="true">
            <div class="export-menu-panel" role="dialog" aria-modal="true" aria-label="检测结果导出格式选择">
              <div class="export-menu-title">选择导出格式</div>
              <button id="exportDetectTxtBtn" class="export-menu-item" type="button">导出为 TXT</button>
              <button id="exportDetectJsonBtn" class="export-menu-item" type="button">导出为 JSON</button>
            </div>
          </div>
        </div>
      </div>

      <textarea id="inputText" rows="10" placeholder="在这里粘贴或输入待检测文本..."></textarea>

      <div class="file-row">
        <input id="fileInput" class="hidden-file-input" type="file" accept=".txt,.docx,.doc" />
        <button id="fileSelectBtn" class="ghost" type="button">选择文件</button>
        <span id="selectedFileName" class="selected-file-name" aria-live="polite"></span>
      </div>
      <div id="fileInfo" class="file-info muted">支持 .txt、.doc、.docx文件</div>

      <button id="detectBtn" class="primary big detect-action-btn">开始检测</button>
      <p id="detectMsg" class="msg"></p>

      <h3>单词级高亮</h3>
      <div id="switchInfo" class="switch-info">切换点：暂无</div>
      <div id="wordHighlight" class="highlight-box highlight-box-with-legend">
        <div class="word-legend legend-floating" aria-label="单词级标签图例">
          <span class="legend-item legend-human">HWT（人类）</span>
          <span class="legend-item legend-ai">AIGT（AI）</span>
        </div>
        <div id="wordHighlightContent">暂无结果</div>
      </div>

      <h3>句子级结果</h3>
      <p class="sentence-help-text">标签由模型对「AI 生成可能性」的判断决定，以 0.5 为分界；置信度表示这次判定有多确定，范围 0.5~1，越接近 1 越确定，越接近 0.5 表示越难区分。</p>
      <div id="sentenceList" class="sentence-list"></div>
    </section>
  </main>

  <script src="/static/common.js?v=20261023-3"></script>
  <script src="/static/detect.js?v=20261023-3"></script>
</body>
</html>
